[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp_sentinel"
version = "0.1.0"
description = "MCP Sentinel - static scanner and runtime guard for MCP servers"
authors = [{name = "MCP Sentinel Team", email = "example@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "pydantic>=2.6",
    "PyYAML>=6",
    "rich>=13",
    "requests>=2.31"
]

[project.scripts]
"mcp-sentinel" = "mcp_sentinel.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
